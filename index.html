<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Unfold Pixel Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* ── DESKTOP — GameBoy device, aspect-ratio locked ── */
      @media (min-width: 769px) {
        body {
          background: #0d0d0d;
          height: 100vh;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .gameboy {
          height: 100vh;
          aspect-ratio: 90 / 148;
          display: flex;
          flex-direction: column;
          background: linear-gradient(160deg, #1e1e38 0%, #141428 100%);
          border-radius: 14px 14px 64px 64px;
          box-shadow:
            0 0 0 3px #0a0a18,
            0 20px 60px rgba(0, 0, 0, 0.9),
            inset 0 1px 0 rgba(255, 255, 255, 0.07);
          position: relative;
        }

        .gameboy__screen {
          height: 58%;
          margin: 20px 28px 0;
          background: #0a0a14;
          border-radius: 6px;
          border: 3px solid #090910;
          box-shadow:
            inset 0 2px 12px rgba(0, 0, 0, 0.8),
            0 0 0 1px rgba(255, 255, 255, 0.04);
          flex-shrink: 0;
          overflow: hidden;
          position: relative;
        }

        .gameboy__controls {
          flex: 1;
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          align-items: center;
          padding: 0 20px 28px;
          background: transparent;
          border-top: 2px solid #1e1e36;
          border-radius: 0 0 60px 60px;
        }
      }

      /* ── MOBILE — full-bleed, no bezel, dvh layout ────── */
      @media (max-width: 768px) {
        body {
          background: #0d0d0d;
          height: 100dvh;
          overflow: hidden;
        }

        .gameboy {
          display: flex;
          flex-direction: column;
          width: 100%;
          height: 100dvh;
          background: #0d0d0d;
          border-radius: 0;
          box-shadow: none;
        }

        .gameboy__screen {
          height: 60dvh;
          margin: 0;
          border-radius: 0;
          border: none;
          box-shadow: none;
          background: #0d0d0d;
          flex-shrink: 0;
          overflow: hidden;
          position: relative;
        }

        .gameboy__controls {
          flex: 1;
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          align-items: center;
          padding: 0 20px;
          padding-bottom: env(safe-area-inset-bottom);
          background: #1a1a2e;
          border-top: 2px solid #2a2a40;
          border-radius: 0;
        }

        /* Larger touch targets on mobile */
        .dpad { width: 126px; }
        .dpad__up, .dpad__down, .dpad__left, .dpad__right, .dpad__nub {
          width: 42px;
          height: 42px;
        }
        .gb-btn { width: 52px; height: 52px; }
        .gb-meta { padding: 7px 14px; font-size: 9px; }
      }

      /* ── SHARED — canvas + buttons (all screen sizes) ─── */
      #game-container {
        width: 100%;
        height: 100%;
      }

      #game-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /* D-pad */
      .gb-left {
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }

      .dpad {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        width: 96px;
      }

      .dpad__mid {
        display: flex;
        flex-direction: row;
        align-items: center;
      }

      .dpad__btn {
        background: #2e2e44;
        border: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        transition: background 0.08s;
        position: relative;
      }

      .dpad__btn:active,
      .dpad__btn.pressed {
        background: #4a4a66;
      }

      .dpad__up,
      .dpad__down {
        width: 32px;
        height: 32px;
        border-radius: 4px 4px 0 0;
      }

      .dpad__down {
        border-radius: 0 0 4px 4px;
      }

      .dpad__left,
      .dpad__right {
        width: 32px;
        height: 32px;
        border-radius: 4px 0 0 4px;
      }

      .dpad__right {
        border-radius: 0 4px 4px 0;
      }

      .dpad__nub {
        width: 32px;
        height: 32px;
        background: #252538;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .dpad__nub::after {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3a3a52;
      }

      .dpad__up::after    { content: '▲'; }
      .dpad__down::after  { content: '▼'; }
      .dpad__left::after  { content: '◀'; }
      .dpad__right::after { content: '▶'; }

      .dpad__btn::after {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: #5a5a78;
        pointer-events: none;
      }

      /* Center: logo + meta buttons */
      .gb-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .gb-logo {
        font-family: 'Press Start 2P', monospace;
        font-size: 9px;
        color: #8888bb;
        letter-spacing: 2px;
        text-shadow: 0 0 8px rgba(136, 136, 187, 0.4);
      }

      .gb-meta-btns {
        display: flex;
        gap: 10px;
      }

      .gb-meta {
        background: #2e2e44;
        border: none;
        border-radius: 20px;
        padding: 5px 10px;
        font-family: 'Silkscreen', monospace;
        font-size: 8px;
        color: #7777aa;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        transition: background 0.08s;
        letter-spacing: 1px;
      }

      .gb-meta:active,
      .gb-meta.pressed {
        background: #4a4a66;
        color: #aaaacc;
      }

      /* A/B buttons + speaker */
      .gb-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }

      .gb-ab {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }

      .gb-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        font-family: 'Press Start 2P', monospace;
        font-size: 9px;
        color: #ffffff;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        transition: filter 0.08s, transform 0.08s;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
      }

      .gb-btn:active,
      .gb-btn.pressed {
        filter: brightness(1.3);
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      }

      .gb-btn--b {
        background: #2a2a5a;
        margin-bottom: 8px;
      }

      .gb-btn--a {
        background: #6b1a2a;
      }

      .gb-speaker {
        width: 40px;
        height: 24px;
        background-image: radial-gradient(circle, #2e2e50 1.5px, transparent 1.5px);
        background-size: 7px 7px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body data-gameboy-frame="true">
    <div class="gameboy">
      <div class="gameboy__screen">
        <div id="game-container"></div>
      </div>
      <div class="gameboy__controls">
        <div class="gb-left">
          <div class="dpad">
            <button class="dpad__btn dpad__up"    data-key="ArrowUp"></button>
            <div class="dpad__mid">
              <button class="dpad__btn dpad__left"  data-key="ArrowLeft"></button>
              <div class="dpad__nub"></div>
              <button class="dpad__btn dpad__right" data-key="ArrowRight"></button>
            </div>
            <button class="dpad__btn dpad__down"  data-key="ArrowDown"></button>
          </div>
        </div>
        <div class="gb-center">
          <span class="gb-logo">UNFOLD</span>
          <div class="gb-meta-btns">
            <button class="gb-meta" data-key="Shift">SELECT</button>
            <button class="gb-meta" data-key="Enter">START</button>
          </div>
        </div>
        <div class="gb-right">
          <div class="gb-ab">
            <button class="gb-btn gb-btn--b" data-key="Escape">B</button>
            <button class="gb-btn gb-btn--a" data-key=" ">A</button>
          </div>
          <div class="gb-speaker"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      const KEY_CODE_MAP = {
        'ArrowUp': 38, 'ArrowDown': 40, 'ArrowLeft': 37, 'ArrowRight': 39,
        'Shift': 16, 'Enter': 13, 'Escape': 27, ' ': 32,
      };
      document.querySelectorAll('[data-key]').forEach(btn => {
        const key     = btn.dataset.key;
        const keyCode = KEY_CODE_MAP[key] ?? 0;
        const fire = (type) => window.dispatchEvent(
          new KeyboardEvent(type, { key, keyCode, which: keyCode, bubbles: true, cancelable: true })
        );
        btn.addEventListener('pointerdown',  (e) => { e.preventDefault(); fire('keydown'); btn.classList.add('pressed'); });
        btn.addEventListener('pointerup',    (e) => { e.preventDefault(); fire('keyup');   btn.classList.remove('pressed'); });
        btn.addEventListener('pointerleave', (e) => { e.preventDefault(); fire('keyup');   btn.classList.remove('pressed'); });
        btn.addEventListener('pointercancel',(e) => { e.preventDefault(); fire('keyup');   btn.classList.remove('pressed'); });
      });
    </script>
  </body>
</html>
